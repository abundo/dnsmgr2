---
dbfile: /var/lib/dnsmgr2/dnsmgr2.sqlite

#----------------------------------------------------------------------
# List of sources, where to read data
#----------------------------------------------------------------------

sources:
    - type: file
      name: /etc/dnsmgr2/records
    # factum2-dns writes JSON instead:
    # - type: json
    #   name: /etc/dnsmgr2/records

#----------------------------------------------------------------------
# DNS definitions
#----------------------------------------------------------------------
dns:
    host_templates:
        # ISC BIND configuration template for Ubuntu
        isc_bind_ubuntu:
            type: isc_bind
            configdir: /etc/bind
            includefile: named.conf.dnsmgr2
            zonesdir: /var/lib/bind
            zonesfile: "{zone}"
            tmpdir: /var/lib/dnsmgr2
            cmd_reload_all: "sudo rndc reload"
            cmd_reload_zone: "sudo rndc reload {zone}"
            cmd_restart: "systemctl restart named.service"
            cmd_status: "rndc status"

    # Templates for SOA record
    soa_templates:
        default_soa:
            mname: ns1.example.com.
            rname: support.example.com.
            # date_serial: YYYYMMDDnn (2018061500)
            serial_format: date_serial
            refresh: 36000
            retry: 3600
            expire: 604800
            minimum: 900

    zone_templates:
        default_dns:
            soa: default_soa
            default_ttl: 900
            dnssec_policy: default
            ns:
                - { name: "@", type: "NS", value: "ns1.example.com." }
                - { name: "@", type: "NS", value: "ns2.example.com." }

#----------------------------------------------------------------------
# DHCP definitions
#----------------------------------------------------------------------
dhcp:
    domain_name: example.com
    dns_servers:
        - 192.0.2.53
        - 192.0.2.54
    host_templates:
        isc_kea:
            type: isc_kea
            ipv4:
                enable: true
                configdir: /etc/kea
                # JSON array of subnets; include from /etc/kea/kea-dhcp4.conf:
                #   "subnet4": <?include "/etc/kea/kea-dhcp4.dnsmgr2.json"?>
                includefile: kea-dhcp4.dnsmgr2.json
                tmpdir: /var/lib/dnsmgr2
                cmd_restart: "systemctl restart kea-dhcp4-server"
                cmd_status: "systemctl is-active kea-dhcp4-server"
            ipv6:
                enable: false
                configdir: /etc/kea
                includefile: kea-dhcp6.dnsmgr2.json
                tmpdir: /var/lib/dnsmgr2
                cmd_restart: "systemctl restart kea-dhcp6-server"
                cmd_status: "systemctl is-active kea-dhcp6-server"

#----------------------------------------------------------------------
# Main entry for config
#----------------------------------------------------------------------

dnsmgr2:
    - host_dns_template: isc_bind_ubuntu
      host_dhcp_template: isc_kea
      prefixes:
          - name: 192.0.2.0/24
            range: 192.0.2.100-192.0.2.200
            # gateway defaults to the first usable address (192.0.2.1)
            # subnet_mask defaults to 255.255.255.0
            # dns_servers: override dhcp.dns_servers for this subnet only
      zones:
          - name: example.com
            type: forward
            dns_template: default_dns

          - name: 192.0.2.0/24
            type: reverse4
            dns_template: default_dns

          - name: 2001:db8:1000::/64
            type: reverse6
            dns_template: default_dns
